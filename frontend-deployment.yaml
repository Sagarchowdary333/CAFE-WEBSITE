apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cafe-frontend
  template:
    metadata:
      labels:
        app: cafe-frontend
    spec:
      containers:
      - name: cafe-frontend
        image: 279391564753.dkr.ecr.us-east-1.amazonaws.com/cafe-frontend-eks:latest
        ports:
        - containerPort: 80